# Раздача статики VitePress. За ingress TLS реальные IP — из доверенных подсетей (Docker / k8s).

map $http_user_agent $is_bot {
    default 0;
    "~*(Googlebot|AdsBot-Google|Google-InspectionTool|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Yandex|Applebot|facebookexternalhit|Twitterbot|LinkedInBot|PetalBot|AhrefsBot|SemrushBot|DotBot|GPTBot|ChatGPT-User|CCBot)" 1;
}

include /etc/nginx/conf.d/docs-auth-realm.map;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Storybook (pnpm build-storybook), тот же домен: /storybook/
    location = /storybook {
        return 302 /storybook/;
    }

    location ^~ /storybook/ {
        auth_basic $docs_auth_realm;
        auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri $uri/ /storybook/index.html;
    }

    location / {
        auth_basic $docs_auth_realm;
        auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
